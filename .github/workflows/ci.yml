name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true

      - name: pin python 3.11
        run: uv python install 3.11

      # No --extra local: torch and transformers are never installed in CI.
      # Every test runs against committed fixtures, so there are no model
      # downloads and no live API calls.
      - name: sync deps
        run: uv sync --frozen --all-groups

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q
        env:
          UNC_BENCH_OFFLINE: "1"
