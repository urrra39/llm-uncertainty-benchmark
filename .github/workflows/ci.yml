name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Must stay >= the uv that writes uv.lock (lockfile revision 3).
          # 0.5.11 predates the format and syncs a wrong subset silently.
          version: "0.12.9"
          enable-cache: true

      - name: pin python 3.11
        run: uv python install 3.11

      # No --extra local: torch and transformers are never installed in CI.
      # Every test runs against committed fixtures, so there are no model
      # downloads and no live API calls.
      - name: sync deps
        run: uv sync --frozen --all-groups

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy

      # No --extra local here either: importing every module must work on the
      # dev dependency set alone, so an undeclared heavy import fails the build
      # instead of passing locally and breaking a fresh clone.
      - name: import every module without heavy deps
        run: uv run python scripts/check_imports.py
        env:
          UNC_BENCH_OFFLINE: "1"

      # The four documents restate results.json in prose; prose drifts. This
      # re-derives every quoted figure and fails on any disagreement.
      - name: audit docs against results.json
        run: uv run python scripts/audit_docs.py
        env:
          UNC_BENCH_OFFLINE: "1"

      - name: pytest
        run: uv run pytest -q
        env:
          UNC_BENCH_OFFLINE: "1"

      # Sole authorship. Any pushed commit message attributing the work to a
      # tool fails the build. History still carries one such trailer, reported
      # and awaiting the owner's decision; the shallow checkout scans the
      # pushed tip, not the past.
      - name: authorship commit messages
        run: |
          if git log --format='%B' | grep -iE "co-authored|generated with|copilot|assisted by|ai assistance|with the help of"; then
            echo "authorship trailer found in commit messages" >&2
            exit 1
          fi

      # Same rule for tracked file contents. Judge and subject model names
      # are objects of study and are whitelisted. This workflow file carries
      # the search pattern itself, so it is excluded from its own scan.
      - name: authorship file contents
        run: |
          if git grep -iE "co-authored|generated with|copilot|assisted by|ai assistance|with the help of" -- . ':!.github/workflows/ci.yml' | grep -viE "qwen2.5-0.5b-instruct|deberta-v3-base-mnli|gpt-5-mini|claude-haiku-4-5"; then
            echo "authorship statement found in tracked files" >&2
            exit 1
          fi
