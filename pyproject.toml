[project]
name = "unc-bench"
version = "0.1.0"
description = "Which cheap uncertainty signal best predicts LLM factual errors?"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "urrra39" }]

dependencies = [
    "pydantic==2.9.2",
    "pyyaml==6.0.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.2",
    "openai==1.54.4",
    "tqdm==4.66.5",
]

[project.optional-dependencies]
# Heavy local-inference extras. CI does not install these; tests use fixtures.
local = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "sentencepiece==0.2.0",
    # DeBERTa-v3's tokenizer ships only the sentencepiece model, and converting
    # it to a fast tokenizer goes through protobuf. Without this, AutoTokenizer
    # raises ImportError on the NLI model only — the Qwen tokenizer is
    # BPE-backed and loads fine, so the failure looks unrelated to the NLI
    # downgrade that caused it.
    "protobuf==5.28.3",
    "accelerate==1.1.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pandas-stubs==2.2.3.241009",
    "types-pyyaml==6.0.12.20240917",
]

[project.scripts]
unc-bench = "unc_bench.cli:main"

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unc_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4"]
ignore = [
    "N803", # allow X, y in stats/ML signatures
    "N806", # allow X_train style locals
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no usable stubs.
module = [
    "matplotlib.*",
    "sklearn.*",
    "scipy.*",
    "torch.*",
    "transformers.*",
    "tqdm.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs model weights or network, skipped in CI",
]
