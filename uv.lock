source = { editable = "." }
dependencies = [
    { name = "matplotlib" },
    { name = "numpy" },
    { name = "openai" },
    { name = "pandas" },
    { name = "pyarrow" },
    { name = "pydantic" },
    { name = "pyyaml" },
    { name = "scikit-learn" },
    { name = "scipy" },
    { name = "tqdm" },
]

[package.optional-dependencies]
local = [
    { name = "accelerate" },
    { name = "sentencepiece" },
    { name = "torch" },
    { name = "transformers" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
