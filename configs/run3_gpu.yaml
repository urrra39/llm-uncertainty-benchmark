run_name: run3_gpu_balanced

# Run #3. Same study as run #2, on a GPU, at n=600 with a balanced split.
#
# Everything not commented below is inherited verbatim from configs/run2.yaml so
# that the two runs differ in model size, n and dataset balance and in nothing
# else. Run #3 has not been executed; no number in this repository comes from it.

# The model under test.
#
# Qwen2.5-3B-Instruct at fp16 is about 6.2 GB of weights, which fits a free
# Colab T4 (16 GB) alongside activations, the KV cache and, in its own pass, the
# DeBERTa NLI model. Same family and tokenizer lineage as run #2's 0.5B, so the
# prompt block and the True/False token assertions carry over unchanged.
#
# fp16 rather than bfloat16 because the T4 is Turing (SM 7.5): fp16 tensor cores,
# no hardware bf16. See docs/DECISIONS.md D23 (session 7).
#
# No quantization. Signal family A reads exact per-token logprobs off the
# generation scores, and post-training quantization perturbs the logits those
# logprobs are computed from. Family A is nine of the eighteen distinct
# orderings, so distorting it would compromise half the study to buy model size
# this hardware does not need. There is deliberately no quantization key here;
# ModelSpec has no such field and adding one would fail the `extra="forbid"`
# check on load.
model_under_test:
  backend: local_transformers
  name: Qwen/Qwen2.5-3B-Instruct
  dtype: float16
  device: auto
  max_new_tokens: 24
  # Open defect D27 (docs/DECISIONS.md, sessions 7-9). Padding a ragged batch
  # perturbs per-token logprobs by up to 2.52e-02 against the unbatched values,
  # while a batch of equal-length prompts is bit-identical (0.00e+00) — measured
  # on CPU/bfloat16 only. That measurement does NOT transfer to CUDA/fp16, where
  # batched GEMM selects kernels by batch dimension. Length-bucketing avoids
  # padding but does not close the defect: `torch.manual_seed` is reset per
  # forward, so co-bucketed prompts draw sampled tokens from interleaved stream
  # positions, and real prompts mostly form singleton buckets anyway. Leave this
  # at 1 until the batch-invariance harness (`unc-bench nondeterminism`) passes
  # on the T4 in fp16. Per-prompt seeds (C2) make sampled tokens width-invariant
  # once batching returns, but they do not make the logprob question go away.
  generation_batch_size: 1

# The one generation every signal is computed on.
greedy:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  top_logprobs: 5

# Extra samples for the self-consistency family.
sampling:
  n_samples: 5
  temperature: 0.7
  top_p: 0.9
  seed_base: 1000
  ablation_n: [1, 2, 3, 5]

nli:
  model_name: MoritzLaurer/DeBERTa-v3-base-mnli
  entailment_threshold: 0.5
  max_length: 128
  batch_size: 16

# Balanced, 300 per dataset, n=600.
#
# Run #2's 90 PopQA / 30 TriviaQA split is the documented mechanism behind its
# pooled-table distortion (README finding 4, docs/LIMITATIONS.md limitation 13):
# the two subsets had base rates of 40% and 90% incorrect, so a signal that
# merely separated the datasets earned pooled AUROC for free, and the 30-row
# column could not support an estimate at all. Equal subset sizes let each
# column carry its own interval.
dataset_mix:
  triviaqa: 300
  popqa: 300
  simpleqa: 0

# Difficulty filters: run #2's TriviaQA settings unchanged; PopQA rebuilt from
# gold-list evidence (see data/gold_quality_report.json and the difficulty
# block below).
#
# Re-measured through the project's own builders against the real corpora
# after dedup + leakage filtering (this session):
#
#   PopQA, 7 relations (below), quantile 0.5, leakage dropped -> 2159 rows,
#     2074 unique questions (118 leaked) = 6.91x margin for 300 draws
#   TriviaQA, easy_only + min_aliases 20, leakage dropped  -> 3746 rows,
#     all unique (314 leaked of 4060) = 12.5x margin
#
# The relations are `capital`, `country`, `sport`, `color` (run #2's,
# minus `capital of`), `religion` + `occupation` (kept: cleared by
# measurement), and `genre` (added: single-alias 0.074, leak 0.006).
# `place of birth` was cut on granularity-span 0.620.
#
# Unverified: whether this slice lands inside the pilot gate's 25-65% band
# for a 3B model. Four of the seven relations have never been generated
# against at any scale.
difficulty:
  triviaqa_easy_only: true
  triviaqa_min_aliases: 20
  # Quantile lowered 0.9 -> 0.5 (s_pop cutoff 69770 -> 618) for one reason:
  # the 0.9 slice holds 318 unique questions after dedup, a 1.06x margin at
  # which the seed is decorative. The tradeoff is a longer popularity tail for
  # a 3B model; the pilot gate (25-65%) is the backstop, and it is the gate's
  # job, not the filter's, to reject a degenerate base rate.
  popqa_popularity_quantile: 0.5
  # Seven relations, selected FROM the gold-quality evidence
  # (data/gold_quality_report.json), not from recall-difficulty intuition:
  # `capital of` removed (echo pathology); `place of birth` removed
  # (granularity-span 0.620: city-vs-country aliases flip labels); `genre`
  # added (single-alias 0.074, leak 0.006 — the most complete list outside the
  # run #2 five). `religion` (0.050) and `occupation` (0.147, leak 0.000) stay:
  # flagged by suspicion, cleared by measurement. `allow_inverse_relations`
  # stays false so any reintroduction fails loudly.
  allow_inverse_relations: false
  # Drop candidate rows where a normalized gold alias sits inside the question
  # (datasets.base.gold_in_question). Counts are in data/dataset_meta.json once
  # built; run #2 predates the check and is unaffected.
  drop_gold_in_question: true
  popqa_relations:
    - "capital"
    - "country"
    - "sport"
    - "color"
    - "religion"
    - "occupation"
    - "genre"

# Two exemplars, for answer FORMAT only. Asserted absent from the eval set at
# generation time. Neither is a TriviaQA or PopQA item.
few_shot:
  enabled: true
  pairs:
    - ["What is the capital city of Japan?", "Tokyo"]
    - ["In which year did the Berlin Wall fall?", "1989"]

dataset_seed: 12345

pilot_gate:
  n_questions: 40
  error_rate_low: 0.25
  error_rate_high: 0.65
  max_iterations: 2

# Judges are stronger models than the subject and are only asked for text, so
# the API gateway's lack of logprobs does not matter here.
judges:
  primary:
    backend: openai_compatible
    name: gpt-5-mini
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  secondary:
    backend: openai_compatible
    name: claude-haiku-4-5
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  cross_validation_n: 120
  kappa_trust_threshold: 0.7
  secondary_seed: 4242

# Recalibrators are fitted on train only and evaluated on the held-out rest.
split:
  train_fraction: 0.3
  seed: 20260101

# Per-dataset bootstrap confidence intervals come from this block. There is no
# separate on/off switch: `analysis.per_dataset_auroc` runs the same stratified
# percentile bootstrap as the pooled table, at `bootstrap_resamples` and
# `ci_level`, whenever the analysis stage passes it a config — which it always
# does. Run #2's results.json predates that code, which is why the README's
# primary table falls back to a Hanley-McNeil approximation. Run #3 is the first
# run that will produce real per-dataset intervals.
#
# Measured cost of that work at n=600: 4.67 s per AUROC interval and 1.17 s per
# AUPRC interval at 10,000 resamples, against 1.14 s and 0.63 s at n=120
# (docs/DECISIONS.md D25, session 7).
analysis:
  bootstrap_resamples: 10000
  bootstrap_seed: 987654321
  ci_level: 0.95
  ece_bins: 10
  target_accuracy: 0.90
  logreg_cv_folds: 5
  logreg_seed: 31337
  min_meaningful_auroc_gap: 0.02
  holm_alpha: 0.05
  nondeterminism_probe_n: 50
  # On: resample question-text clusters rather than rows in every bootstrap.
  # With dedup active the clusters are singletons and the two draws agree, so
  # this is defence in depth rather than a correction.
  cluster_bootstrap: true

# Run #3 writes into its own directory and its own results file, so nothing here
# can overwrite run #2's published numbers. The artifacts under data/run3/ are
# tracked by git from run #3 on; see docs/DECISIONS.md, session 7.
paths:
  raw_dir: data/raw
  cache_dir: data/cache
  artifacts_dir: data/run3
  figures_dir: figures/run3
  results_json: results_run3.json
  human_validation_csv: data/human_validation_sample_run3.csv

# Frozen prompts, identical to run #2's. These strings are part of the cache key,
# so editing them invalidates cached responses rather than silently mixing prompt
# versions — and editing them here would also stop run #3 being comparable to
# run #2.
prompts:
  system: >-
    You answer short factual questions. Reply with the shortest possible factual
    span that answers the question: a name, a date, a number, or a place. Do not
    write a sentence. Do not explain. Always give your single best guess, even
    when you are unsure. Never refuse and never say you do not know.
  user_template: "Q: {question}\nA:"
  abstain_token: UNKNOWN
  verify_template: >-
    Question: {question}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verify_with_samples_template: >-
    Question: {question}

    Here are some answers that were sampled from a model for this question:
    {samples}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verbal_confidence_template: >-
    Question: {question}

    Proposed answer: {answer}

    How confident are you that the proposed answer is factually correct? Reply
    with a single integer from 0 to 100 and nothing else.
