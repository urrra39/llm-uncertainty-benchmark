run_name: full_1200

# The model under test. Backend is swappable: point this at a vLLM
# OpenAI-compatible server and nothing else changes.
#
# Intended: Qwen2.5-7B-Instruct on local vLLM. This machine has no GPU and the
# available API gateway returns no logprobs, so the run uses the same model
# family at 0.5B on CPU. See docs/DECISIONS.md D1-D3.
model_under_test:
  backend: local_transformers
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  max_new_tokens: 24

# The one generation every signal is computed on.
greedy:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  top_logprobs: 5

# Extra samples for the self-consistency family.
sampling:
  n_samples: 5
  temperature: 0.7
  top_p: 0.9
  seed_base: 1000
  ablation_n: [1, 2, 3, 5]

nli:
  model_name: MoritzLaurer/DeBERTa-v3-base-mnli
  entailment_threshold: 0.5
  max_length: 128
  batch_size: 16

dataset_mix:
  popqa: 600
  triviaqa: 400
  simpleqa: 200
dataset_seed: 12345

pilot_gate:
  n_questions: 100
  error_rate_low: 0.25
  error_rate_high: 0.65
  max_iterations: 2

# Judges are stronger models than the subject and are only asked for text, so
# the API gateway's lack of logprobs does not matter here.
judges:
  primary:
    backend: openai_compatible
    name: gpt-5-mini
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  secondary:
    backend: openai_compatible
    name: claude-haiku-4-5
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  cross_validation_n: 100
  kappa_trust_threshold: 0.7
  secondary_seed: 4242

# Recalibrators are fitted on train only and evaluated on the held-out rest.
split:
  train_fraction: 0.3
  seed: 20260101

analysis:
  bootstrap_resamples: 10000
  bootstrap_seed: 987654321
  ci_level: 0.95
  ece_bins: 15
  target_accuracy: 0.90
  logreg_cv_folds: 5
  logreg_seed: 31337
  min_meaningful_auroc_gap: 0.02
  holm_alpha: 0.05
  nondeterminism_probe_n: 50

paths:
  raw_dir: data/raw
  cache_dir: data/cache
  artifacts_dir: data/artifacts
  figures_dir: figures
  results_json: results.json
  human_validation_csv: data/human_validation_sample.csv

# Frozen prompts. These strings are part of the cache key, so editing them
# invalidates cached responses rather than silently mixing prompt versions.
prompts:
  system: >-
    You answer short factual questions. Reply with the shortest possible factual
    span that answers the question: a name, a date, a number, or a place. Do not
    write a sentence. Do not explain. If you do not know the answer, reply with
    exactly UNKNOWN.
  user_template: "Q: {question}\nA:"
  abstain_token: UNKNOWN
  verify_template: >-
    Question: {question}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verify_with_samples_template: >-
    Question: {question}

    Here are some answers that were sampled from a model for this question:
    {samples}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verbal_confidence_template: >-
    Question: {question}

    Proposed answer: {answer}

    How confident are you that the proposed answer is factually correct? Reply
    with a single integer from 0 to 100 and nothing else.
