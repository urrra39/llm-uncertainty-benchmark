run_name: run2b_clean

# Run #2b: run #2's exact configuration on the hardware at hand, differing
# ONLY in dataset construction. Same model, decoding, prompts, sampling, NLI
# and n=120. What changed: `capital of` removed (echo contamination, Part A1),
# gold-in-question rows dropped, near-duplicate questions deduped, and a
# balanced 60 PopQA / 60 TriviaQA split instead of 90/30. Pre-registered in
# docs/PREREGISTRATION.md ("Run #2b" section) BEFORE execution.
#
# Labels: no judge credentials exist in an offline/CPU environment, so the
# label stage falls back to exact match plus the fuzzy containment rule and
# records heuristic_fallback_rows > 0 with no kappa. That is weaker than
# run #2's judged labels in one way and stronger in another (no judge blind
# spots); the README states both. The E4 prediction is tested under heuristic
# labels and the comparison is labelled as such throughout.
model_under_test:
  backend: local_transformers
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  max_new_tokens: 24

# The one generation every signal is computed on. Identical to run #2.
greedy:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  top_logprobs: 5

# Extra samples for the self-consistency family. Identical to run #2, except
# each sample seed is additionally derived from the question id (C2), so
# sampled tokens are invariant to batch width and row order.
sampling:
  n_samples: 5
  temperature: 0.7
  top_p: 0.9
  seed_base: 1000
  ablation_n: [1, 2, 3, 5]

nli:
  model_name: MoritzLaurer/DeBERTa-v3-base-mnli
  entailment_threshold: 0.5
  max_length: 128
  batch_size: 16

# Balanced 60/60 at n=120. Run #2's 90/30 split is the documented mechanism
# behind its pooled distortion; there is no reason to inherit it, and both
# subsets then support their own interval.
dataset_mix:
  triviaqa: 60
  popqa: 60
  simpleqa: 0
# Decontaminated difficulty: run #2's relations minus `capital of`
# (INVERSE_RELATIONS guard would raise without allow_inverse_relations, which
# stays false). The four survivors were selected from
# data/gold_quality_report.json for alias-list completeness (country 0.000
# single-alias fraction the best of all 16; sport 0.143; color 0.059;
# capital's 0.181 leak fraction is removed row-by-row by the drop flag).
# Measured: 200 rows, 192 unique after collapse (7 leaked) = 3.20x margin
# for 60 draws. TriviaQA: run #2's easy slice unchanged (3746 unique).
difficulty:
  triviaqa_easy_only: true
  triviaqa_min_aliases: 20
  popqa_popularity_quantile: 0.9
  popqa_relations: ["capital", "country", "sport", "color"]
  allow_inverse_relations: false
  drop_gold_in_question: true

# Two exemplars, for answer FORMAT only. Asserted absent from the eval set at
# generation time. Identical to run #2, so answers stay comparable.
few_shot:
  enabled: true
  pairs:
    - ["What is the capital city of Japan?", "Tokyo"]
    - ["In which year did the Berlin Wall fall?", "1989"]

dataset_seed: 12345

pilot_gate:
  n_questions: 40
  error_rate_low: 0.25
  error_rate_high: 0.65
  max_iterations: 2

# Judges: identical names to run #2 so a credentialed rerun is comparable.
# Without GSK_API_KEY the label stage records heuristic_fallback_rows and no
# kappa rather than failing the run; see the header note.
judges:
  primary:
    backend: openai_compatible
    name: gpt-5-mini
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  secondary:
    backend: openai_compatible
    name: claude-haiku-4-5
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  cross_validation_n: 120
  kappa_trust_threshold: 0.7
  secondary_seed: 4242

# Recalibrators are fitted on train only and evaluated on the held-out rest.
split:
  train_fraction: 0.3
  seed: 20260101

analysis:
  bootstrap_resamples: 10000
  bootstrap_seed: 987654321
  ci_level: 0.95
  ece_bins: 10
  target_accuracy: 0.90
  logreg_cv_folds: 5
  logreg_seed: 31337
  min_meaningful_auroc_gap: 0.02
  holm_alpha: 0.05
  nondeterminism_probe_n: 50
  # On: with dedup active the clusters are singletons and the draw agrees
  # with row-level exactly, so this is defence in depth.
  cluster_bootstrap: true

# Run #2b writes into its own directory and its own results file, so run #2's
# published numbers are untouched. Artifacts under data/run2b/ are TRACKED by
# git (see .gitignore and tests/test_artifact_tracking.py): the per-row
# signal values are committed, so every per-dataset bootstrap interval is
# computable from a clone. This alone retires RUN2-ARTIFACTS for the run
# that matters.
paths:
  raw_dir: data/raw
  cache_dir: data/cache
  artifacts_dir: data/run2b
  figures_dir: figures/run2b
  results_json: results_run2b.json
  human_validation_csv: data/human_validation_sample_run2b.csv

# Frozen prompts, identical to run #2's. These strings are part of the cache
# key, so editing them here would stop run #2b being comparable to run #2.
prompts:
  system: >-
    You answer short factual questions. Reply with the shortest possible factual
    span that answers the question: a name, a date, a number, or a place. Do not
    write a sentence. Do not explain. Always give your single best guess, even
    when you are unsure. Never refuse and never say you do not know.
  user_template: "Q: {question}\nA:"
  abstain_token: UNKNOWN
  verify_template: >-
    Question: {question}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verify_with_samples_template: >-
    Question: {question}

    Here are some answers that were sampled from a model for this question:
    {samples}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verbal_confidence_template: >-
    Question: {question}

    Proposed answer: {answer}

    How confident are you that the proposed answer is factually correct? Reply
    with a single integer from 0 to 100 and nothing else.
