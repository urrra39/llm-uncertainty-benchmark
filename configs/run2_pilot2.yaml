run_name: run2_pilot2_40

# The model under test. Backend is swappable: point this at a vLLM
# OpenAI-compatible server and nothing else changes.
#
# Intended: Qwen2.5-7B-Instruct on local vLLM. This machine has no GPU and the
# available API gateway returns no logprobs, so the run uses the same model
# family at 0.5B on CPU. See docs/DECISIONS.md D1-D3.
model_under_test:
  backend: local_transformers
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  max_new_tokens: 24

# The one generation every signal is computed on.
greedy:
  temperature: 0.0
  top_p: 1.0
  seed: 0
  top_logprobs: 5

# Extra samples for the self-consistency family.
sampling:
  n_samples: 5
  temperature: 0.7
  top_p: 0.9
  seed_base: 1000
  ablation_n: [1, 2, 3, 5]

nli:
  model_name: MoritzLaurer/DeBERTa-v3-base-mnli
  entailment_threshold: 0.5
  max_length: 128
  batch_size: 16

# TriviaQA only, sized to what this machine's measured throughput affords in
# the remaining budget. See docs/DECISIONS.md for the pilot measurement that
# set this number.
dataset_mix:
  triviaqa: 28
  popqa: 12
  simpleqa: 0
# Run #2: raise the base rate by restricting both sources to their easier end.
# Run #1 drew unrestricted TriviaQA and got 7/75 answered rows correct, which
# made every AUROC noise. See docs/DECISIONS.md run #2 D1.
difficulty:
  triviaqa_easy_only: true
  triviaqa_min_aliases: 20
  popqa_popularity_quantile: 0.9
  popqa_relations: ["capital", "country", "capital of", "sport", "color"]

# Two exemplars, for answer FORMAT only. Asserted absent from the eval set at
# generation time. Neither is a TriviaQA or PopQA item.
few_shot:
  enabled: true
  pairs:
    - ["What is the capital city of Japan?", "Tokyo"]
    - ["In which year did the Berlin Wall fall?", "1989"]

dataset_seed: 12345

pilot_gate:
  n_questions: 40
  error_rate_low: 0.25
  error_rate_high: 0.65
  max_iterations: 2

# Judges are stronger models than the subject and are only asked for text, so
# the API gateway's lack of logprobs does not matter here.
judges:
  primary:
    backend: openai_compatible
    name: gpt-5-mini
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  secondary:
    backend: openai_compatible
    name: claude-haiku-4-5
    api_key_env: GSK_API_KEY
    max_new_tokens: 8
  cross_validation_n: 100
  kappa_trust_threshold: 0.7
  secondary_seed: 4242

# Recalibrators are fitted on train only and evaluated on the held-out rest.
split:
  train_fraction: 0.3
  seed: 20260101

analysis:
  bootstrap_resamples: 2000
  bootstrap_seed: 987654321
  ci_level: 0.95
  ece_bins: 10
  target_accuracy: 0.90
  logreg_cv_folds: 5
  logreg_seed: 31337
  min_meaningful_auroc_gap: 0.02
  holm_alpha: 0.05
  nondeterminism_probe_n: 50

paths:
  raw_dir: data/raw
  cache_dir: data/cache
  artifacts_dir: data/run2_pilot2
  figures_dir: figures
  results_json: results_run2_pilot2.json
  human_validation_csv: data/human_validation_sample.csv

# Frozen prompts. These strings are part of the cache key, so editing them
# invalidates cached responses rather than silently mixing prompt versions.
prompts:
  system: >-
    You answer short factual questions. Reply with the shortest possible factual
    span that answers the question: a name, a date, a number, or a place. Do not
    write a sentence. Do not explain. Always give your single best guess, even
    when you are unsure. Never refuse and never say you do not know.
  user_template: "Q: {question}\nA:"
  abstain_token: UNKNOWN
  verify_template: >-
    Question: {question}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verify_with_samples_template: >-
    Question: {question}

    Here are some answers that were sampled from a model for this question:
    {samples}

    Proposed answer: {answer}

    Is the proposed answer factually correct? Reply with exactly one word, True
    or False.
  verbal_confidence_template: >-
    Question: {question}

    Proposed answer: {answer}

    How confident are you that the proposed answer is factually correct? Reply
    with a single integer from 0 to 100 and nothing else.
is_pilot: true
